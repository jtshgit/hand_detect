<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand Detection</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      height: 100vh;
      background-color: #f0f0f0;
    }
    #container {
      position: relative;
      width: 640px;
      height: 480px;
      display: none; /* Initially hidden */
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    canvas {
      pointer-events: none;
    }
    .info {
      margin-top: 10px;
      font-size: 18px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h1>Hand Detection Dashboard</h1>
  <button id="loadModelBtn">Load Model</button>
  <div id="container">
    <video id="video" autoplay muted></video>
    <canvas id="canvas"></canvas>
  </div>
  <div class="info">
    <p id="status">Status: Waiting to load model...</p>
    <p id="hands-detected">Hands Detected: 0</p>
  </div>
  <script src="./app.js"></script>
</body>
</html>
